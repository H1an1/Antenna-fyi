<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antenna HyperFrames Promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050605;
      }

      #antenna-promo {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: #a89888;
        background:
          radial-gradient(circle at 14% 8%, rgba(226, 196, 110, 0.08), transparent 420px),
          linear-gradient(180deg, #050605 0%, #11100c 46%, #070806 100%);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .scene,
      .dashboard-wrap,
      .video-field,
      .final-lockup {
        position: absolute;
        inset: 0;
      }

      .scene {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .dashboard-wrap {
        overflow: hidden;
        background: #050605;
        transform-origin: 56% 48%;
      }

      .dashboard-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(1.04) contrast(1.03) brightness(0.94);
      }

      .dashboard-vignette {
        position: absolute;
        inset: 0;
        opacity: 0.22;
        pointer-events: none;
        background:
          radial-gradient(circle at 57% 55%, transparent 0%, transparent 36%, rgba(0, 0, 0, 0.42) 78%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.3), transparent 28%, transparent 76%, rgba(0, 0, 0, 0.28));
      }

      .cursor {
        position: absolute;
        left: 1282px;
        top: 432px;
        z-index: 6;
        width: 34px;
        height: 34px;
        opacity: 0;
        transform-origin: 8px 8px;
        filter: drop-shadow(0 0 12px rgba(254, 241, 225, 0.3));
      }

      .cursor::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 0;
        width: 21px;
        height: 21px;
        border-right: 4px solid #fef1e1;
        border-bottom: 4px solid #fef1e1;
        transform: rotate(-18deg) skew(8deg, 8deg);
      }

      .cursor::after {
        content: "";
        position: absolute;
        left: 19px;
        top: 21px;
        width: 10px;
        height: 18px;
        border-radius: 5px;
        background: #fef1e1;
        transform: rotate(-18deg);
      }

      .video-field {
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        perspective: 1600px;
        pointer-events: none;
      }

      .video-field::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 48%, rgba(226, 196, 110, 0.13), transparent 360px),
          linear-gradient(180deg, rgba(5, 6, 5, 0.18), rgba(5, 6, 5, 0.92));
      }

      .video-row {
        position: relative;
        z-index: 1;
        width: 1850px;
        height: 710px;
        transform-style: preserve-3d;
      }

      .video-tile {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 220px;
        height: 330px;
        margin-left: -110px;
        margin-top: -165px;
        overflow: hidden;
        border: 1px solid rgba(215, 184, 102, 0.28);
        background: #050605;
        transform-origin: 50% 112%;
        box-shadow:
          0 28px 82px rgba(0, 0, 0, 0.46),
          inset 0 0 0 1px rgba(254, 241, 225, 0.025);
      }

      .video-tile.lead {
        z-index: 30;
        width: 330px;
        height: 495px;
        margin-left: -165px;
        margin-top: -247.5px;
        border-color: rgba(226, 196, 110, 0.52);
        box-shadow:
          0 42px 120px rgba(0, 0, 0, 0.58),
          0 0 34px rgba(215, 184, 102, 0.15);
      }

      .video-tile video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.92;
      }

      .final-lockup {
        z-index: 12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        opacity: 0;
        pointer-events: none;
      }

      .final-wordmark {
        display: block;
        width: 580px;
        max-width: 70%;
        filter: drop-shadow(0 0 14px rgba(215, 184, 102, 0.18));
      }

      .tagline {
        margin: 0;
        color: #d8cab8;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="antenna-promo"
      data-composition-id="antenna-promo"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene" data-layout-allow-overflow>
        <div class="dashboard-wrap">
          <video
            id="dashboard-interaction"
            class="dashboard-video clip"
            src="assets/dashboard-interaction.mp4"
            data-start="0"
            data-duration="8.58"
            data-track-index="1"
            muted
            playsinline
          ></video>
          <div class="dashboard-vignette" aria-hidden="true"></div>
        </div>

        <div class="cursor" aria-hidden="true"></div>

        <div class="video-field">
          <div class="video-row">
            <div class="video-tile" data-x="-650" data-y="76" data-rot="-26" data-depth="1">
              <video id="tile-01" src="assets/profile-01-hermes.mp4" data-start="8.45" data-duration="9.55" data-track-index="12" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="-520" data-y="38" data-rot="-19" data-depth="2">
              <video id="tile-02" src="assets/profile-02-athena.mp4" data-start="8.45" data-duration="9.55" data-track-index="13" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="-390" data-y="10" data-rot="-12" data-depth="3">
              <video id="tile-03" src="assets/profile-03-prometheus.mp4" data-start="8.45" data-duration="9.55" data-track-index="14" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="-260" data-y="-10" data-rot="-7" data-depth="4">
              <video id="tile-04" src="assets/profile-04-apollo.mp4" data-start="8.45" data-duration="9.55" data-track-index="15" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="-130" data-y="-24" data-rot="-3" data-depth="5">
              <video id="tile-05" src="assets/profile-05-artemis.mp4" data-start="8.45" data-duration="9.55" data-track-index="16" muted playsinline></video>
            </div>
            <div class="video-tile lead" data-x="0" data-y="-58" data-rot="0" data-depth="11">
              <video id="tile-current" src="assets/profile-current.mp4" data-start="8.12" data-duration="9.88" data-track-index="11" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="130" data-y="-24" data-rot="3" data-depth="5">
              <video id="tile-06" src="assets/profile-06-aphrodite.mp4" data-start="8.45" data-duration="9.55" data-track-index="17" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="260" data-y="-10" data-rot="7" data-depth="4">
              <video id="tile-07" src="assets/profile-07-dionysus.mp4" data-start="8.45" data-duration="9.55" data-track-index="18" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="390" data-y="10" data-rot="12" data-depth="3">
              <video id="tile-08" src="assets/profile-08-hades.mp4" data-start="8.45" data-duration="9.55" data-track-index="19" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="520" data-y="38" data-rot="19" data-depth="2">
              <video id="tile-09" src="assets/profile-09-persephone.mp4" data-start="8.45" data-duration="9.55" data-track-index="20" muted playsinline></video>
            </div>
            <div class="video-tile" data-x="650" data-y="76" data-rot="26" data-depth="1">
              <video id="tile-10" src="assets/profile-10-odysseus.mp4" data-start="8.45" data-duration="9.55" data-track-index="21" muted playsinline></video>
            </div>
          </div>
        </div>

        <div class="final-lockup">
          <img
            id="final-wordmark"
            class="final-wordmark clip"
            src="assets/antenna.svg"
            alt="Antenna"
            data-start="14.7"
            data-duration="3.3"
            data-track-index="30"
          />
          <p class="tagline">Signal for the room.</p>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({ paused: true });
        const cardX = (_index, tile) => Number(tile.dataset.x || 0);
        const cardY = (_index, tile) => Number(tile.dataset.y || 0);
        const cardRotation = (_index, tile) => Number(tile.dataset.rot || 0);
        const cardZ = (_index, tile) => Number(tile.dataset.depth || 0);

        gsap.set(".dashboard-wrap", { transformOrigin: "56% 48%" });
        gsap.set(".cursor", { opacity: 0 });
        gsap.set(".video-field", { opacity: 0 });
        gsap.set(".video-tile", { opacity: 0, x: 0, y: -48, zIndex: cardZ, scale: 0.72, rotation: 0, rotateY: 0 });
        gsap.set(".video-tile.lead", { opacity: 0, y: -60, zIndex: 30, scale: 1.06, rotation: 0 });
        gsap.set(".final-lockup", { opacity: 0, scale: 0.92 });

        tl.fromTo(".dashboard-wrap", { scale: 1, x: 0, y: 0 }, { scale: 1.035, x: -24, y: -12, duration: 4.05, ease: "power1.inOut" }, 0);
        tl.to(".dashboard-wrap", { scale: 1.07, x: -58, y: -26, duration: 2.4, ease: "sine.inOut" }, 4.05);

        tl.fromTo(".cursor", { opacity: 0, x: 150, y: 96 }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power2.out" }, 4.16);
        tl.to(".cursor", { scale: 0.78, duration: 0.12, ease: "power2.in" }, 4.72);
        tl.to(".cursor", { scale: 1, duration: 0.16, ease: "power2.out" }, 4.84);
        tl.to(".cursor", { opacity: 0, duration: 0.26, ease: "power2.out" }, 5.12);

        tl.to(".dashboard-vignette", { opacity: 0.58, duration: 0.8, ease: "power2.out" }, 6.72);
        tl.to(".dashboard-wrap", { opacity: 0.16, scale: 1.105, duration: 0.82, ease: "power2.out" }, 8.15);

        tl.fromTo(".video-field", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 8.12);
        tl.fromTo(".video-tile.lead", { opacity: 0, scale: 1.14, y: -74 }, { opacity: 1, scale: 1.16, y: cardY, rotation: 0, duration: 0.34, ease: "power3.out" }, 8.12);
        tl.fromTo(
          ".video-tile:not(.lead)",
          { opacity: 0, x: 0, y: -48, scale: 0.78, rotation: 0, rotateY: 0 },
          { opacity: 1, x: cardX, y: cardY, scale: 1, rotation: cardRotation, duration: 0.78, stagger: { amount: 0.18, from: "center" }, ease: "power3.out" },
          8.5,
        );
        tl.to(".video-tile.lead", { x: 0, y: -58, scale: 1.08, duration: 0.78, ease: "power3.out" }, 8.5);
        tl.to(".video-tile video", { scale: 1.055, duration: 5.8, ease: "none" }, 8.72);
        tl.fromTo(".video-row", { y: 36 }, { y: -24, duration: 5.9, ease: "sine.inOut" }, 8.65);

        tl.to(".video-row", { scale: 0.5, y: 0, opacity: 0, duration: 0.92, ease: "power3.in" }, 14.55);
        tl.fromTo(".final-lockup", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.76, ease: "power3.out" }, 15.02);
        tl.fromTo(".tagline", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 15.72);

        window.__timelines["antenna-promo"] = tl;
      </script>
    </div>
  </body>
</html>
